services:
  postgres:
    image: postgres:16
    container_name: koinon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koinon
      POSTGRES_PASSWORD: koinon_dev_password
      POSTGRES_DB: koinon_db
    ports:
      - "5444:5432"   
    volumes:
      - koinon_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: koinon-redis
    restart: unless-stopped
    ports:
      - "6390:6379"   
volumes:
  koinon_pg_data: